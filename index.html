<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedortodo" id="contenedor">
        <script>
            const imagenes = [
              "img/CamiEyes.jpeg",
              "img/PilamiCole.jpeg",
              "img/PilamiGhibli.jpeg",
              "img/CamiBarbijo.jpeg",
              "img/CamiSonrisa.jpeg"
            ];
            
            let index = 0;
            setInterval(() => {
              const contenedor = document.getElementById("contenedor");
              contenedor.style.background = `url('${imagenes[index]}') no-repeat center center`;
              index = (index + 1) % imagenes.length;
            }, 4000); // cambia cada 4 segundos
            </script>
        <div class="message">I Love You</div>
        <div id="bubbles-text"></div>
        <script src="script.js"></script>
    </div>
</body>
</html>
